<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Battle</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #151b24;
    --accent: #e8b23a;
    --text: #e7e9ee;
    --muted: #8a93a3;
    --danger: #e05656;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1a2230 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  h1 {
    font-size: 20px;
    letter-spacing: 2px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
  }
  h1 .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .wrap { display: flex; gap: 16px; align-items: stretch; }
  #stage {
    position: relative;
    background: #000;
    border: 3px solid #2a3444;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5), inset 0 0 60px rgba(0,0,0,.4);
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; text-align: center;
    background: rgba(4,8,12,.82);
    border-radius: 4px;
    z-index: 5;
    padding: 20px;
    transition: opacity .2s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay .title { font-size: 34px; font-weight: 800; letter-spacing: 4px; }
  #overlay .sub { color: var(--muted); font-size: 14px; line-height: 1.8; }
  #overlay .status { font-size: 26px; font-weight: 700; }
  #overlay .status.win { color: #7ee07e; }
  #overlay .status.lose { color: var(--danger); }
  .btn {
    cursor: pointer;
    border: none;
    background: linear-gradient(180deg, #f0c14b, #d99a2b);
    color: #1a1204;
    font-weight: 700;
    font-size: 16px;
    padding: 12px 34px;
    border-radius: 8px;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 #9a6a18, 0 8px 20px rgba(232,178,58,.25);
    transition: transform .06s ease, box-shadow .06s ease, filter .15s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9a6a18; }
  .key {
    display: inline-block; min-width: 22px; padding: 2px 7px;
    border: 1px solid #3a4556; border-bottom-width: 3px;
    border-radius: 5px; background: #1c2431; color: #cfd6e2;
    font-size: 12px; margin: 0 2px; font-family: monospace;
  }
  .panel {
    background: var(--panel);
    border: 1px solid #2a3444;
    border-radius: 8px;
    padding: 16px 18px;
    min-width: 150px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .panel .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel .label { color: var(--muted); font-size: 13px; letter-spacing: 1px; }
  .panel .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .panel .value.lives { color: #7ee07e; }
  .panel .value.score { color: var(--accent); }
  .lives-icons { display: flex; gap: 6px; }
  .life-icon { width: 14px; height: 14px; background: var(--accent); border-radius: 2px; box-shadow: inset 0 0 4px rgba(0,0,0,.4); }
  .life-icon.empty { background: #2a3444; }
  .enemies-left { font-size: 12px; color: var(--muted); text-align: center; }
  .controls { color: var(--muted); font-size: 12px; line-height: 2; }
  .muted { color: var(--muted); }
  @media (max-width: 760px) {
    .wrap { flex-direction: column; align-items: center; }
    .panel { flex-direction: row; flex-wrap: wrap; min-width: 0; justify-content: center; }
    h1 { font-size: 17px; }
  }
</style>
</head>
<body>
  <h1><span class="dot"></span>坦克大战 · TANK BATTLE</h1>

  <div class="wrap">
    <div id="stage-wrap">
      <canvas id="stage" width="780" height="780"></canvas>
      <div id="overlay">
        <div class="title">坦克大战</div>
        <div class="sub">
          保卫你的基地 <span style="color:#7ee07e">▲</span>，消灭所有敌人<br>
          <span class="key">W A S D</span> / <span class="key">↑ ← ↓ →</span> 移动 &nbsp;·&nbsp; <span class="key">空格</span> / <span class="key">J</span> 开火
        </div>
        <button class="btn" id="startBtn">开始游戏</button>
        <div class="sub">按 <span class="key">P</span> 暂停</div>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <span class="label">分数</span>
        <span class="value score" id="score">0</span>
      </div>
      <div class="row">
        <span class="label">关卡</span>
        <span class="value" id="level">1</span>
      </div>
      <div class="row" style="flex-direction:column; align-items:flex-start; gap:8px;">
        <span class="label">生命</span>
        <div class="lives-icons" id="lives"></div>
      </div>
      <div class="row" style="flex-direction:column; align-items:flex-start; gap:8px;">
        <span class="label">剩余敌人</span>
        <div class="enemies-left" id="enemies">0</div>
      </div>
      <div class="controls">
        移动：WASD / 方向键<br>
        开火：空格 / J<br>
        暂停：P
      </div>
    </div>
  </div>

<script>
"use strict";

/* ============================================================
   坦克大战 —— 单文件 Canvas 实现
   ============================================================ */

// ---------- 常量 ----------
const TILE = 60;                 // 一个网格单元（像素）
const COLS = 13, ROWS = 13;      // 战场网格
const W = COLS * TILE, H = ROWS * TILE;
const TANK = 44;                 // 坦克边长
const BULLET = 8;                // 子弹边长

// 方向
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

// 地图元素
const T = {
  EMPTY: 0, BRICK: 1, STEEL: 2, WATER: 3, TREES: 4, BASE: 5,
};

// 分数
const SCORE = { enemy: 100, tank: 150, levelBonus: 500 };

// ---------- Canvas ----------
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const livesEl = document.getElementById('lives');
const enemiesEl = document.getElementById('enemies');
const overlay = document.getElementById('overlay');
const overlayTitle = overlay.querySelector('.title');
const overlayStatus = overlay.querySelector('.status');
const startBtn = document.getElementById('startBtn');

// ---------- 音频（Web Audio，无需素材文件）----------
let audioCtx = null;
function beep(freq, dur, type = 'square', vol = 0.12, slide = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + dur);
}
const sfx = {
  shoot() { beep(420, 0.08, 'square', 0.08, -200); },
  hit() { beep(180, 0.12, 'sawtooth', 0.12, -80); },
  brick() { beep(120, 0.1, 'sawtooth', 0.1, -40); },
  explode() { beep(90, 0.3, 'sawtooth', 0.16, -60); },
  spawn() { beep(660, 0.12, 'triangle', 0.1, 120); },
  powerup() { beep(880, 0.15, 'triangle', 0.1, 220); },
};

// ---------- 输入 ----------
const keys = new Set();
const pressed = new Set(); // 单次触发（开火）
window.addEventListener('keydown', e => {
  const c = e.key.toLowerCase();
  const code = e.code;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(code) || ['w','a','s','d','j','p'].includes(c)) {
    e.preventDefault();
  }
  if (!e.repeat) pressed.add(c === ' ' ? ' ' : c);
  keys.add(c);
  if (code === 'ArrowUp') keys.add('w');
  if (code === 'ArrowDown') keys.add('s');
  if (code === 'ArrowLeft') keys.add('a');
  if (code === 'ArrowRight') keys.add('d');
});
window.addEventListener('keyup', e => {
  const c = e.key.toLowerCase();
  keys.delete(c);
  if (e.code === 'ArrowUp') keys.delete('w');
  if (e.code === 'ArrowDown') keys.delete('s');
  if (e.code === 'ArrowLeft') keys.delete('a');
  if (e.code === 'ArrowRight') keys.delete('d');
});

// ---------- 关卡地图 ----------
const LEVELS = [
  // 第 1 关：对称砖墙
  [
    ".............",
    ".BB...S...BB.",
    ".B..B.S.B..B.",
    ".B..BBBBB..B.",
    ".B..B...B..B.",
    "..S.......S..",
    "..B..B.B..B..",
    "..B.......B..",
    "..B..BBB..B..",
    "..S.......S..",
    ".BBBB...BBBB.",
    ".BB...B...BB.",
    "......H......",
  ],
  // 第 2 关：钢墙+水域
  [
    "........W....",
    ".BBBB..W..BB.",
    ".B..S..W.....",
    ".B..BBBBWBBBB",
    "....B..W..B..",
    "SS..B..WW.B..",
    "....B..WW.B..",
    "SS..B..W..B..",
    "....BBBB.BB..",
    ".B...S..B....",
    ".BBBBBBBBBB..",
    ".B........B..",
    "......H......",
  ],
  // 第 3 关：树林掩护
  [
    "TTTTTTTTTTTTT",
    "T.BB...BB...T",
    "T.B.S.B.S.B.T",
    "T...B.B.B...T",
    "T.S.BBBBB.S.T",
    "T...B...B...T",
    "T.BB..B..BB.T",
    "T.S...B...S.T",
    "T...BBBBB...T",
    "T.B.S.B.S.B.T",
    "T.BB...BB..BT",
    "T.......B...T",
    "......H......",
  ],
];

function parseLevel(strs) {
  const map = Array.from({ length: ROWS }, () => Array(COLS).fill(T.EMPTY));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = strs[r][c];
      map[r][c] =
        ch === 'B' ? T.BRICK :
        ch === 'S' ? T.STEEL :
        ch === 'W' ? T.WATER :
        ch === 'T' ? T.TREES :
        ch === 'H' ? T.BASE : T.EMPTY;
    }
  }
  return map;
}

// ---------- 游戏状态 ----------
let state = 'menu'; // menu | playing | paused | over | win
let map = [];
let player = null;
let enemies = [];
let bullets = [];
let particles = [];
let spawnQueue = [];
let level = 1;
let score = 0;
let lives = 3;
let baseAlive = true;
let spawnTimer = 0;
let enemiesPerLevel = 12;
let enemiesSpawned = 0;
let shake = 0;
let flash = 0;

function resetGame() {
  level = 1;
  score = 0;
  lives = 3;
  startLevel();
}

function startLevel() {
  map = parseLevel(LEVELS[(level - 1) % LEVELS.length]);
  enemies = [];
  bullets = [];
  particles = [];
  spawnQueue = [];
  baseAlive = true;
  enemiesPerLevel = 8 + level * 2;
  enemiesSpawned = 0;
  spawnTimer = 90; // 稍后开始刷怪
  spawnPlayer();
  updateHUD();
}

function spawnPlayer() {
  const x = Math.floor(COLS / 2) * TILE + (TILE - TANK) / 2;
  const y = (ROWS - 2) * TILE + (TILE - TANK) / 2; // 出生在基地正上方一格
  player = {
    x, y, dir: DIR.UP, speed: 2.6,
    cd: 0, inv: 120, spawnAnim: 30,
  };
  sfx.spawn();
}

function spawnEnemy() {
  // 三个出生点：左上、上中、右上
  const spots = [0, Math.floor(COLS / 2), COLS - 1].map(c => ({
    x: c * TILE + (TILE - TANK) / 2, y: 0,
  }));
  const spot = spots[Math.floor(Math.random() * spots.length)];
  const dirs = [DIR.DOWN, DIR.DOWN, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
  enemies.push({
    x: spot.x, y: spot.y,
    dir: dirs[Math.floor(Math.random() * dirs.length)],
    speed: 1.1 + Math.min(0.9, level * 0.08),
    cd: Math.floor(Math.random() * 60) + 40,
    inv: 0,
    moveTimer: 0,
    moveDur: 60 + Math.floor(Math.random() * 90),
    type: level > 2 && Math.random() < 0.3 ? 'fast' : 'normal',
  });
  sfx.spawn();
}

// ---------- 移动 / 碰撞 ----------
function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// 坦克能否移动到 (nx, ny)
function canMove(tank, nx, ny, self) {
  if (nx < 0 || ny < 0 || nx + TANK > W || ny + TANK > H) return false;
  const box = { x: nx, y: ny, w: TANK, h: TANK };
  // 与障碍物
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = map[r][c];
      if (t === T.EMPTY || t === T.TREES || t === T.WATER) continue; // 水稍后单独判定（玩家可进？不，都不让进）
      if (t === T.BRICK || t === T.STEEL || t === T.BASE) {
        if (rectCollide(box, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) return false;
      }
    }
  }
  // 与其它坦克
  const tanks = [player, ...enemies].filter(t => t && t !== self && t.alive !== false);
  for (const t of tanks) {
    if (rectCollide(box, { x: t.x, y: t.y, w: TANK, h: TANK })) return false;
  }
  return true;
}

function moveTank(tank, dir, self) {
  tank.dir = dir;
  const nx = tank.x + DX[dir] * tank.speed;
  const ny = tank.y + DY[dir] * tank.speed;
  if (canMove(tank, nx, ny, self)) {
    tank.x = nx; tank.y = ny;
    return true;
  }
  // 尝试对齐到网格边缘滑动（简单做法：仅一个轴向）
  if (dir === DIR.UP || dir === DIR.DOWN) {
    const snapped = Math.round(tank.x / 4) * 4;
    if (snapped !== tank.x && canMove(tank, snapped, ny, self)) { tank.x = snapped; tank.y = ny; return true; }
  } else {
    const snapped = Math.round(tank.y / 4) * 4;
    if (snapped !== tank.y && canMove(tank, nx, snapped, self)) { tank.x = nx; tank.y = snapped; return true; }
  }
  return false;
}

// ---------- 子弹 ----------
function fireBullet(tank) {
  if (tank.cd > 0) return;
  tank.cd = 18;
  const cx = tank.x + TANK / 2, cy = tank.y + TANK / 2;
  const off = TANK / 2 + 2;
  const bx = cx + DX[tank.dir] * off - BULLET / 2;
  const by = cy + DY[tank.dir] * off - BULLET / 2;
  bullets.push({ x: bx, y: by, dir: tank.dir, speed: 5.5, owner: tank === player ? 'player' : 'enemy' });
  sfx.shoot();
}

function updateBullets() {
  for (const b of bullets) {
    b.x += DX[b.dir] * b.speed;
    b.y += DY[b.dir] * b.speed;
    if (b.x < 0 || b.y < 0 || b.x > W || b.y > H) { b.dead = true; continue; }
    const box = { x: b.x, y: b.y, w: BULLET, h: BULLET };

    // 命中地图
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = map[r][c];
        if (t === T.EMPTY || t === T.TREES || t === T.WATER) continue;
        if (!rectCollide(box, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) continue;
        if (t === T.BRICK) {
          map[r][c] = T.EMPTY;
          b.dead = true;
          spawnParticles(c * TILE + TILE / 2, r * TILE + TILE / 2, '#b5651d', 6);
          sfx.brick();
        } else if (t === T.STEEL) {
          b.dead = true;
          spawnParticles(b.x, b.y, '#9fb4c8', 3);
          sfx.hit();
        } else if (t === T.BASE) {
          map[r][c] = T.EMPTY;
          baseAlive = false;
          b.dead = true;
          bigExplosion(c * TILE + TILE / 2, r * TILE + TILE / 2);
          sfx.explode();
        }
      }
    }
    if (b.dead) continue;

    // 命中玩家
    if (b.owner === 'enemy' && player && player.alive !== false && player.inv <= 0) {
      if (rectCollide(box, { x: player.x, y: player.y, w: TANK, h: TANK })) {
        b.dead = true;
        destroyPlayer();
      }
    }
    // 命中敌人
    if (b.owner === 'player') {
      for (const e of enemies) {
        if (e.alive === false) continue;
        if (rectCollide(box, { x: e.x, y: e.y, w: TANK, h: TANK })) {
          b.dead = true;
          destroyEnemy(e);
          break;
        }
      }
    }
    // 子弹相撞
    if (!b.dead && b.owner === 'player') {
      for (const e of bullets) {
        if (e === b || e.owner !== 'enemy') continue;
        if (rectCollide(box, { x: e.x, y: e.y, w: BULLET, h: BULLET })) {
          b.dead = true; e.dead = true;
          spawnParticles(b.x, b.y, '#ffd76e', 4);
        }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);
}

// ---------- 击杀 ----------
function destroyEnemy(e) {
  e.alive = false;
  bigExplosion(e.x + TANK / 2, e.y + TANK / 2);
  sfx.explode();
  score += e.type === 'fast' ? SCORE.tank : SCORE.enemy;
  shake = 8;
  updateHUD();
  // 掉落道具
  if (Math.random() < 0.2) spawnPowerup(e.x, e.y);
}

function destroyPlayer() {
  player.alive = false;
  bigExplosion(player.x + TANK / 2, player.y + TANK / 2);
  sfx.explode();
  shake = 12;
  lives--;
  updateHUD();
  if (lives <= 0) {
    endGame(false);
  } else {
    // 重生
    setTimeout(() => {
      if (state === 'playing') spawnPlayer();
    }, 800);
  }
}

function bigExplosion(x, y) {
  spawnParticles(x, y, '#ff7a3c', 14);
  spawnParticles(x, y, '#ffd23c', 10);
  spawnParticles(x, y, '#5a5a5a', 8);
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 3;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 20 + Math.random() * 20, color, size: 2 + Math.random() * 4,
    });
  }
}

function spawnPowerup(x, y) {
  // 简单起见：加分道具直接生效
  score += 200;
  sfx.powerup();
  updateHUD();
}

// ---------- 敌人 AI ----------
function updateEnemies() {
  if (spawnTimer > 0) spawnTimer--;
  else if (enemiesSpawned < enemiesPerLevel && enemies.filter(e => e.alive !== false).length < 4) {
    spawnEnemy();
    enemiesSpawned++;
    spawnTimer = 90;
  }

  for (const e of enemies) {
    if (e.alive === false) continue;
    if (e.inv > 0) e.inv--;

    // 移动 AI
    e.moveTimer--;
    if (e.moveTimer <= 0) {
      // 随机改变方向，偶尔朝玩家方向
      if (player && player.alive !== false && Math.random() < 0.4) {
        const dx = player.x - e.x, dy = player.y - e.y;
        e.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIR.RIGHT : DIR.LEFT) : (dy > 0 ? DIR.DOWN : DIR.UP);
      } else {
        e.dir = Math.floor(Math.random() * 4);
      }
      e.moveDur = 40 + Math.floor(Math.random() * 90);
      e.moveTimer = e.moveDur;
    }
    if (!moveTank(e, e.dir, e)) {
      // 被挡住就换个方向
      e.moveTimer = 0;
    }

    // 开火
    if (e.cd > 0) e.cd--;
    if (player && player.alive !== false && Math.random() < 0.02 && e.cd <= 0) {
      fireBullet(e);
    }
  }
  enemies = enemies.filter(e => e.alive !== false);

  // 胜利判定
  if (enemiesSpawned >= enemiesPerLevel && enemies.length === 0) {
    score += SCORE.levelBonus;
    updateHUD();
    nextLevel();
  }
}

function nextLevel() {
  level++;
  if (level > LEVELS.length * 3) {
    endGame(true);
    return;
  }
  flash = 30;
  startLevel();
}

// ---------- 结束 ----------
function endGame(win) {
  state = win ? 'win' : 'over';
  overlay.classList.remove('hidden');
  overlayTitle.textContent = '坦克大战';
  overlayStatus.textContent = win ? '胜利！' : '游戏结束';
  overlayStatus.className = 'status ' + (win ? 'win' : 'lose');
  startBtn.textContent = '再来一局';
  sfx.explode();
}

// ---------- HUD ----------
function updateHUD() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  livesEl.innerHTML = Array.from({ length: 3 }, (_, i) =>
    `<div class="life-icon ${i < lives ? '' : 'empty'}"></div>`).join('');
  const left = enemiesPerLevel - enemiesSpawned + enemies.filter(e => e.alive !== false).length;
  enemiesEl.textContent = left + ' / ' + enemiesPerLevel;
}

// ---------- 渲染 ----------
function drawTile(c, r) {
  const t = map[r][c];
  const x = c * TILE, y = r * TILE;
  switch (t) {
    case T.BRICK: {
      ctx.fillStyle = '#8a3a1c';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#b54820';
      for (let i = 0; i < 3; i++) {
        const yy = y + i * 20;
        for (let j = 0; j < 2; j++) {
          const xx = x + j * 30 + (i % 2 ? 15 : 0);
          ctx.fillRect(xx + 2, yy + 2, 26, 16);
        }
      }
      break;
    }
    case T.STEEL: {
      ctx.fillStyle = '#5c6a7a';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#aab6c4';
      ctx.fillRect(x + 6, y + 6, TILE - 12, TILE - 12);
      ctx.fillStyle = '#3d4856';
      ctx.fillRect(x + 14, y + 14, TILE - 28, TILE - 28);
      break;
    }
    case T.WATER: {
      ctx.fillStyle = '#1d4f8a';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#2f6fb0';
      ctx.fillRect(x + 8, y + 12, 44, 8);
      ctx.fillRect(x + 10, y + 34, 40, 8);
      break;
    }
    case T.TREES: {
      ctx.fillStyle = '#1d3d1d';
      ctx.fillRect(x, y, TILE, TILE);
      break;
    }
    case T.BASE: {
      ctx.fillStyle = baseAlive ? '#d8a33a' : '#333';
      ctx.fillRect(x, y, TILE, TILE);
      if (baseAlive) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(x + 30, y + 16);
        ctx.lineTo(x + 6, y + 44);
        ctx.lineTo(x + 54, y + 44);
        ctx.closePath();
        ctx.fill();
      }
      break;
    }
  }
}

function drawTank(t, color, isPlayer, inv) {
  if (inv > 0 && Math.floor(inv / 4) % 2 === 0) return; // 闪烁
  const x = t.x, y = t.y;
  ctx.save();
  ctx.translate(x + TANK / 2, y + TANK / 2);
  ctx.rotate((t.dir * Math.PI) / 2);

  // 履带
  ctx.fillStyle = color.dark;
  ctx.fillRect(-22, -22, 44, 8);
  ctx.fillRect(-22, 14, 44, 8);
  // 履带纹理
  ctx.fillStyle = color.track;
  for (let i = -20; i <= 20; i += 8) {
    ctx.fillRect(i, -22, 3, 8);
    ctx.fillRect(i, 14, 3, 8);
  }
  // 车身
  ctx.fillStyle = color.body;
  ctx.fillRect(-18, -16, 36, 32);
  // 炮塔
  ctx.fillStyle = color.turret;
  ctx.beginPath();
  ctx.arc(0, 0, 12, 0, Math.PI * 2);
  ctx.fill();
  // 炮管
  ctx.fillStyle = color.barrel;
  ctx.fillRect(-3, -22, 6, 22);
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(-18, -16, 36, 6);

  ctx.restore();

  // 出生护盾
  if (isPlayer && t.spawnAnim > 0) {
    ctx.strokeStyle = '#7ee07e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + TANK / 2, y + TANK / 2, 26, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawBullet(b) {
  ctx.fillStyle = b.owner === 'player' ? '#fff3b0' : '#ff9d5c';
  ctx.fillRect(b.x - 1, b.y - 1, BULLET + 2, BULLET + 2);
  ctx.fillStyle = b.owner === 'player' ? '#ffd23c' : '#ff6b3c';
  ctx.fillRect(b.x + 1, b.y + 1, BULLET - 2, BULLET - 2);
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // 地面
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * TILE, 0); ctx.lineTo(i * TILE, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * TILE); ctx.lineTo(W, i * TILE); ctx.stroke();
  }

  // 抖动
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.9;
    if (shake < 0.5) shake = 0;
  }

  // 地图（先画地基，再画坦克、子弹）
  const trees = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (map[r][c] === T.TREES) { trees.push([r, c]); continue; }
      drawTile(c, r);
    }
  }

  // 子弹
  for (const b of bullets) drawBullet(b);

  // 敌人
  for (const e of enemies) {
    drawTank(e, { dark: '#4a4a4a', track: '#333', body: '#7a7a7a', turret: '#5c5c5c', barrel: '#3a3a3a' }, false, e.inv);
  }

  // 玩家
  if (player && player.alive !== false) {
    drawTank(player, { dark: '#9a7a1a', track: '#6b5208', body: '#e0b53a', turret: '#f0d060', barrel: '#c89a20' }, true, player.inv);
  }

  // 树林（覆盖在坦克上方）
  for (const [r, c] of trees) drawTile(c, r);

  ctx.restore();

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // 关卡切换闪白
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash / 30})`;
    ctx.fillRect(0, 0, W, H);
    flash--;
  }
}

// ---------- 更新 ----------
function update() {
  if (state !== 'playing') return;

  // 玩家控制
  if (player && player.alive !== false) {
    if (player.inv > 0) player.inv--;
    if (player.spawnAnim > 0) player.spawnAnim--;
    if (player.cd > 0) player.cd--;

    let moving = false;
    if (keys.has('w')) { moveTank(player, DIR.UP, player); moving = true; }
    else if (keys.has('s')) { moveTank(player, DIR.DOWN, player); moving = true; }
    else if (keys.has('a')) { moveTank(player, DIR.LEFT, player); moving = true; }
    else if (keys.has('d')) { moveTank(player, DIR.RIGHT, player); moving = true; }

    if (pressed.has(' ') || pressed.has('j')) {
      fireBullet(player);
    }
  }

  updateEnemies();
  updateBullets();

  // 敌人撞基地（物理上不能撞进去，但玩家/敌人子弹已处理；这里处理敌人坦克压过基地的情况不会发生，因为基地不可通行）

  // 粒子
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  updateHUD();

  // 基地被摧毁
  if (!baseAlive) {
    endGame(false);
    return;
  }
}

// ---------- 主循环 ----------
let last = 0;
function loop(ts) {
  const dt = ts - last;
  last = ts;
  // 固定步长，避免高刷屏过快
  if (dt >= 16) {
    update();
    render();
    // 处理单次按键（在 update 之后清空，确保开火等一次性输入能被读到）
    if (pressed.size) pressed.clear();
  }
  requestAnimationFrame(loop);
}

// ---------- 启动 ----------
startBtn.addEventListener('click', () => {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  overlay.classList.add('hidden');
  resetGame();
  state = 'playing';
});

// 暂停
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'p') {
    if (state === 'playing') {
      state = 'paused';
      overlay.classList.remove('hidden');
      overlayTitle.textContent = '暂停';
      overlayStatus.textContent = '';
      overlayStatus.className = 'status';
      startBtn.textContent = '继续';
    } else if (state === 'paused') {
      overlay.classList.add('hidden');
      state = 'playing';
    }
  }
});

// 初始渲染
resetGame();
state = 'menu';
render();
requestAnimationFrame(loop);
</script>
</body>
</html>
